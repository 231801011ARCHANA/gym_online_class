<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Portal System</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f9;
      color: #333;
    }
    header {
      background: #003366;
      color: #fff;
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 1.8rem;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      margin: 0 1rem;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
      background: linear-gradient(to right, #003366, #336699);
      color: white;
      text-align: center;
    }
    .hero h2 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    .hero p {
      font-size: 1.2rem;
      max-width: 600px;
    }
    .buttons {
      margin-top: 2rem;
    }
    .buttons a {
      text-decoration: none;
      color: white;
      background: #ff9900;
      padding: 0.8rem 1.5rem;
      margin: 0 1rem;
      border-radius: 25px;
      font-weight: bold;
      transition: background 0.3s ease;
    }
    .buttons a:hover {
      background: #e68a00;
    }
    footer {
      background: #003366;
      color: white;
      text-align: center;
      padding: 1rem;
      margin-top: 3rem;
    }
    @media (max-width: 600px) {
      .hero h2 {
        font-size: 2rem;
      }
      .buttons a {
        display: block;
        margin: 1rem auto;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Job Portal</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Jobs</a>
      <a href="#">Login</a>
      <a href="#">Register</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Find Your Dream Job Today</h2>
    <p>Explore thousands of opportunities from top companies. Register now and take the next step in your career!</p>
    <div class="buttons">
      <a href="#">Explore Jobs</a>
      <a href="#">Post a Job</a>
    </div>
  </section>

  <footer>
    © 2025 Job Portal System. All rights reserved.
  </footer>

</body>
</html>
